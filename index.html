<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>Cao thủ tính nhẩm</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d2430; --muted:#5e6878; --line:#e3ded3;
  --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#e2f1ec;
  --ok:#1f8a4c; --ok-soft:#e3f5ea; --bad:#c0392b; --bad-soft:#fbe9e7;
  --warn:#a86a12; --warn-soft:#fdf3e1; --k:#f1ede4;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14171c; --card:#1d2128; --ink:#e8eaee; --muted:#9aa3b2; --line:#2e343e;
    --accent:#4fb79a; --accent-ink:#0c1a16; --accent-soft:#1d3530;
    --ok:#5fcf8b; --ok-soft:#173326; --bad:#ff7b6b; --bad-soft:#3a1f1c;
    --warn:#f0b65a; --warn-soft:#3a2e18; --k:#262b34; --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;line-height:1.55;padding-bottom:96px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--accent)}
[hidden]{display:none!important}

header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.5rem;padding:.4rem 1rem;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.05rem;color:var(--ink);text-decoration:none;padding:.3rem 0;white-space:nowrap}
nav{display:flex;gap:.2rem;margin-left:auto;overflow-x:auto;max-width:100%}
nav a{padding:.45rem .7rem;border-radius:.5rem;color:var(--muted);font-size:.92rem;text-decoration:none;white-space:nowrap}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}

main{max-width:880px;margin:0 auto;padding:1rem}
h1{font-size:1.55rem;line-height:1.25;margin:.4rem 0 .3rem}
h2{font-size:1.2rem;margin:0 0 .2rem}
.lead{color:var(--muted);margin:0 0 1rem}
.muted{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem;box-shadow:var(--shadow);margin-bottom:1rem}

/* Home */
.intro ol{margin:.3rem 0 0;padding-left:1.2rem}
.intro li{margin:.15rem 0}
.grp{margin:1.6rem 0}
.gn{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:.75rem;font-weight:700;padding:.1rem .5rem;border-radius:99px;vertical-align:middle;margin-right:.3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.7rem;margin-top:.7rem}
.card{display:flex;flex-direction:column;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:.85rem .95rem;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.ct{font-weight:700}
.cs{font-size:.88rem;color:var(--muted);flex:1}
.bd{align-self:flex-start;font-size:.75rem;padding:.12rem .5rem;border-radius:99px;background:var(--k);color:var(--muted);margin-top:.3rem}
.bd.good{background:var(--ok-soft);color:var(--ok)}
.bd.mid{background:var(--warn-soft);color:var(--warn)}
.bd.low{background:var(--bad-soft);color:var(--bad)}

/* Topic */
.crumb{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.crumb a{text-decoration:none;font-weight:600}
.tabs{display:flex;gap:.4rem;margin:.6rem 0 1rem;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:.55rem .8rem;color:var(--muted);font-weight:600;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.ex-body{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:.4rem 1.1rem 1rem;box-shadow:var(--shadow)}
.ex-body h3{font-size:1.02rem;margin:1rem 0 .3rem}
.ex-body p{margin:.5rem 0}
.ex-body ul,.ex-body ol{padding-left:1.25rem;margin:.4rem 0}
.ex-body li{margin:.25rem 0}
.ex{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:.5rem;padding:.55rem .8rem;margin:.6rem 0;font-variant-numeric:tabular-nums}
.warn{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:.5rem;padding:.55rem .8rem;margin:.6rem 0}
.k{background:var(--k);padding:.05rem .35rem;border-radius:.3rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb{border-collapse:collapse;margin:.5rem 0;font-variant-numeric:tabular-nums;font-size:.95rem}
.tb td,.tb th{border:1px solid var(--line);padding:.25rem .55rem;text-align:center}
.tb th{background:var(--k)}
.tbwrap{overflow-x:auto}
.sample{background:var(--card);border:1px dashed var(--accent);border-radius:1rem;padding:.8rem 1rem;margin:1rem 0}
.sh{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.sh b{margin-right:auto}
.sq{font-size:1.35rem;font-weight:700;margin:.6rem 0 .2rem;font-variant-numeric:tabular-nums}
.sa{margin:.2rem 0}
.pn{display:flex;justify-content:space-between;gap:1rem;margin:1.5rem 0 .5rem;font-size:.9rem}
.pn a{text-decoration:none;font-weight:600;max-width:48%}

.btn{border:1px solid var(--line);background:var(--card);border-radius:.6rem;padding:.5rem .9rem;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.big{padding:.75rem 1.2rem;font-size:1.05rem;width:100%}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline;font-size:.9rem}
select{background:var(--card);border:1px solid var(--line);border-radius:.5rem;padding:.4rem .5rem}

.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.8rem}
.levels button{border:1.5px solid var(--line);background:var(--card);border-radius:.7rem;padding:.45rem .3rem;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.levels button small{font-weight:400;font-size:.72rem;color:var(--muted);text-align:center}
.levels button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* Practice */
.pbar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.88rem;color:var(--muted);margin-bottom:.5rem;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.pt{font-weight:700;color:var(--ink)}
.pt.hot{color:var(--bad)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem;box-shadow:var(--shadow)}
.qtag{font-size:.78rem;color:var(--accent);font-weight:700;min-height:1em}
.q{font-size:2.1rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:.4rem 0 .2rem;word-break:break-word}
.q.long{font-size:1.15rem;font-weight:650;text-align:left;line-height:1.45}
.qh{text-align:center;font-size:.85rem;color:var(--muted);margin-bottom:.6rem}
.q.long + .qh{text-align:left}
.arow{display:flex;gap:.5rem;align-items:center;margin-top:.6rem}
.ans{flex:1;min-width:0;font-size:1.5rem;padding:.5rem .7rem;border-radius:.6rem;border:2px solid var(--line);background:var(--bg);text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.ans:focus{outline:none;border-color:var(--accent)}
.unit{color:var(--muted);font-size:.9rem;white-space:nowrap}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.6rem}
.choices button{padding:.8rem;font-size:1.15rem;font-weight:700;border-radius:.7rem;border:1.5px solid var(--line);background:var(--bg)}
.fb{margin-top:.8rem}
.fb .ok{background:var(--ok-soft);color:var(--ok);font-weight:700;padding:.55rem .8rem;border-radius:.6rem}
.fb .bad{background:var(--bad-soft);color:var(--bad);font-weight:700;padding:.55rem .8rem;border-radius:.6rem}
.sol{background:var(--k);border-radius:.6rem;padding:.55rem .8rem;margin-top:.5rem;font-variant-numeric:tabular-nums;line-height:1.7}
details{margin-top:.4rem}
summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.acts{display:flex;justify-content:space-between;gap:.5rem;margin-top:.8rem;flex-wrap:wrap}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin-top:.7rem}
.kp button{font-size:1.35rem;padding:.7rem 0;border-radius:.65rem;border:1px solid var(--line);background:var(--card);font-weight:600;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none}
.kp button:active{background:var(--accent-soft)}
.kp .ok2{grid-column:span 2;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:1.1rem}
.kp .fn{background:var(--k);font-size:1.1rem}
.kpt{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;margin-top:.7rem;font-size:.85rem;color:var(--muted)}
.kpt label{display:flex;gap:.35rem;align-items:center}

.done{text-align:center}
.done .bignum{font-size:3.5rem;font-weight:800;color:var(--accent);line-height:1.1}
.done .btns{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:.8rem}

/* Mix */
.fld{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.8rem}
.fld > label{font-weight:700;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:flex;align-items:center;gap:.35rem;border:1px solid var(--line);border-radius:99px;padding:.3rem .7rem;font-size:.88rem;background:var(--bg);cursor:pointer}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}

/* Stats */
.st{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.st th,.st td{padding:.45rem .4rem;border-bottom:1px solid var(--line);text-align:right}
.st th:first-child,.st td:first-child{text-align:left}
.st .gr td{background:var(--k);font-weight:700;text-align:left}
.st a{text-decoration:none}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1rem}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:.7rem;text-align:center}
.sum b{display:block;font-size:1.5rem;color:var(--accent)}

/* Font FAB (kích thước px cố định để nút không phóng to theo chữ) */
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:50;display:flex;align-items:center;gap:8px;font-size:16px}
.fabb{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fabp{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.fabp button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:15px}
.fsv{min-width:46px;text-align:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

@media (max-width:600px){
  main{padding:.75rem}
  h1{font-size:1.3rem}
  .q{font-size:1.85rem}
  .row3{grid-template-columns:1fr}
  .sum b{font-size:1.25rem}
  .st .hide-s{display:none}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">🧮 Cao thủ tính nhẩm</a>
  <nav>
    <a href="#/" data-nav="home">Bài học</a>
    <a href="#/mix" data-nav="mix">Luyện tổng hợp</a>
    <a href="#/stats" data-nav="stats">Thống kê</a>
  </nav>
</header>
<main id="app"></main>

<div class="fab">
  <div class="fabp" hidden>
    <button data-d="-1" aria-label="Giảm cỡ chữ">A−</button>
    <span class="fsv">100%</span>
    <button data-d="1" aria-label="Tăng cỡ chữ">A+</button>
    <button data-d="0" aria-label="Cỡ chữ mặc định">↺</button>
  </div>
  <button class="fabb" aria-label="Chỉnh cỡ chữ" aria-expanded="false">Aa</button>
</div>

<script>
/*GEN-START*/
// ================== Tiện ích ==================
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const r2=x=>Math.round(x*1e6)/1e6;
const nf=new Intl.NumberFormat('vi-VN',{maximumFractionDigits:2});
const f=n=>nf.format(n);
const pad=(n,w=2)=>String(n).padStart(w,'0');
const B=x=>`<b>${f(x)}</b>`;
const nz=(a,b)=>{let x;do{x=ri(a,b)}while(x%10===0);return x};
const sgn=s=>s>0?'+':'−';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function strip0(n){let z=0;while(n%10===0&&n!==0){n/=10;z++}return[n,z]}
function placeParts(n){const s=String(n),o=[];for(let i=0;i<s.length;i++){const d=+s[i];if(d)o.push(d*10**(s.length-1-i))}return o}
function buSol(x,base){const k=String(base).length-1;const s=pad(x,k);return s.split('').map((d,i)=>i<k-1?`9−${d}=${9-d}`:`10−${d}=${10-d}`).join(' · ')+` → ${B(base-x)}`}
function halves(n,t){const a=[];let x=n;for(let i=0;i<t;i++){x/=2;a.push(f(x))}return a.join(' → ')}
function dr(n){n=Math.abs(n);return n===0?0:1+(n-1)%9}
function drChain(n){let s=String(n);const o=[];while(s.length>1){const t=[...s].reduce((a,c)=>a+ +c,0);o.push(t);s=String(t)}return o.length?`${f(n)} → ${o.join(' → ')}`:`${n}`}
function sig2(n){const L=String(Math.round(n)).length;if(L<=2)return n;const p=10**(L-2);return Math.round(n/p)*p}
function countUp(b,R){const st=[];let cur=b,place=10;while(cur<R){const nx=Math.ceil(cur/place)*place;if(nx===cur){place*=10;continue}if(nx>R)break;st.push([nx,nx-cur]);cur=nx;place*=10}if(cur<R)st.push([R,R-cur]);return st}
function parseNum(s){
  s=String(s).trim().replace(/[\s%]/g,'').replace(/−/g,'-');
  if(!s)return null;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const x=Number(s);return isFinite(x)?x:null;
}
function pctSol(p,N){
  const t10=N/10,t1=N/100,ans=p*N/100;
  let s=`10% = ${f(t10)}; 1% = ${f(t1)}. `;
  if(p===50)return s+`50% = một nửa = ${B(ans)}`;
  if(p===25)return s+`25% = một phần tư = ${B(ans)}`;
  const u=p%10,tn=Math.floor(p/10);
  if(u>=8){const up=p+(10-u);return s+`${p}% = ${up}% − ${10-u}% = ${f(up*N/100)} − ${f((10-u)*N/100)} = ${B(ans)}`}
  const arr=[];
  if(tn)arr.push([`${tn*10}%`,tn*t10]);
  if(u===5)arr.push(['5% (nửa của 10%)',N/20]);else if(u)arr.push([`${u}%`,u*t1]);
  if(arr.length===1)return s+`${arr[0][0]} = ${B(ans)}`;
  return s+`${arr.map(x=>x[0]).join(' + ')} = ${arr.map(x=>f(x[1])).join(' + ')} = ${B(ans)}`;
}

// ================== Nhóm bài ==================
const GROUPS=[
  {n:'Nền tảng',d:'Phản xạ cơ bản — phải thuộc như bảng chữ cái thì các mẹo khác mới nhanh.'},
  {n:'Cộng & trừ',d:'Tính từ trái sang phải, làm tròn – bù, quy tắc 9–9–10, đếm lên.'},
  {n:'Phép nhân',d:'Nhân với số đặc biệt, bình phương, hằng đẳng thức, phương pháp cơ số 100.'},
  {n:'Phép chia',d:'Đổi chia thành nhân, rút gọn, tách số bị chia, dấu hiệu chia hết.'},
  {n:'Phần trăm & phân số',d:'Nhóm dùng nhiều nhất trong kinh doanh: %, chiết khấu, tăng giảm, VAT.'},
  {n:'Ước lượng & kiểm tra',d:'Phản xạ “con số này có hợp lý không?” — làm tròn, quy tắc 72, thử số 9.'},
  {n:'Bài toán kinh doanh',d:'Margin, giá bán, hòa vốn, doanh thu, tỷ giá, lãi suất, chia lãi, đơn vị tiền.'}
];

// ================== Các bài học ==================
const T=[
// ---------- NHÓM 0 ----------
{id:'bang',g:0,name:'Bảng cửu chương mở rộng',short:'Phản xạ nhân dưới 1 giây, mở rộng đến 12 × 12 và 19 × 9.',lv:['2–9 × 2–9','6–12 × 6–12','11–19 × 3–9'],
ex:`<p>Bảng cửu chương là “từ vựng” của tính nhẩm. Mục tiêu không phải là <i>tính ra</i> mà là <i>nhìn thấy ngay</i> kết quả, dưới 1 giây. Mọi mẹo phía sau đều quy về các phép nhân 1 chữ số.</p>
<h3>Các cặp hay nhầm nhất — luyện riêng</h3>
<div class="ex">6×7 = 42 · 6×8 = 48 · 7×8 = 56 · 7×9 = 63 · 8×9 = 72 · 6×9 = 54 · 8×8 = 64</div>
<h3>Mở rộng đến 19</h3>
<ul><li>Số từ 11 đến 19: tách thành <span class="k">10 + phần lẻ</span>. <span class="k">17 × 8 = 80 + 56 = 136</span></li>
<li>Nhân 12 = nhân 10 + nhân 2: <span class="k">12 × 7 = 70 + 14 = 84</span></li>
<li>Nhân 9: kết quả có tổng hai chữ số bằng 9 (9×7 = 63 → 6+3 = 9) — dùng để tự kiểm tra.</li></ul>`,
gen(l){let a,b;if(l===1){a=ri(2,9);b=ri(2,9)}else if(l===2){a=ri(6,12);b=ri(6,12)}else{a=ri(11,19);b=ri(3,9)}
let sol=`${a} × ${b} = ${B(a*b)}`;
if(a>10)sol=`${a} × ${b} = 10 × ${b} + ${a-10} × ${b} = ${10*b} + ${(a-10)*b} = ${B(a*b)}`;
else if(b>10)sol=`${a} × ${b} = ${a} × 10 + ${a} × ${b-10} = ${10*a} + ${a*(b-10)} = ${B(a*b)}`;
return{q:`${a} × ${b}`,a:a*b,sol}}},

{id:'bp25',g:0,name:'Bình phương 1–25 (và xa hơn)',short:'Thuộc lòng bình phương — nền cho hằng đẳng thức và ước lượng.',lv:['2–12','11–25','26–40'],
ex:`<p>Bình phương xuất hiện liên tục trong mẹo nhân (hằng đẳng thức, số cách đều). Thuộc lòng đến 25² sẽ tiết kiệm rất nhiều thời gian.</p>
<div class="tbwrap"><table class="tb"><tr><th>n</th><td>11</td><td>12</td><td>13</td><td>14</td><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td><td>20</td><td>21</td><td>22</td><td>23</td><td>24</td><td>25</td></tr>
<tr><th>n²</th><td>121</td><td>144</td><td>169</td><td>196</td><td>225</td><td>256</td><td>289</td><td>324</td><td>361</td><td>400</td><td>441</td><td>484</td><td>529</td><td>576</td><td>625</td></tr></table></div>
<h3>Khi quên: tính lại bằng (a + b)²</h3>
<p><span class="k">(a + b)² = a² + 2ab + b²</span>, với a là số tròn chục.</p>
<div class="ex">34² = (30 + 4)² = 900 + 2×30×4 + 16 = 900 + 240 + 16 = 1.156</div>`,
gen(l){const n=l===1?ri(2,12):l===2?ri(11,25):ri(26,40);let sol;
if(n<=10)sol=`${n}² = ${n} × ${n} = ${B(n*n)}`;else{const t=Math.floor(n/10)*10,u=n%10;
sol=u===0?`${n}² = ${B(n*n)}`:`${n}² = (${t} + ${u})² = ${t}² + 2 × ${t} × ${u} + ${u}² = ${f(t*t)} + ${2*t*u} + ${u*u} = ${B(n*n)}`}
return{q:`${n}²`,a:n*n,sol}}},

{id:'bu100',g:0,name:'Cặp bù 100, 1.000 và 1',short:'Thấy 37 là nghĩ ngay 63 — dùng khi thối tiền và tính phần trăm còn lại.',lv:['100 − x','1.000 − số tròn chục','1 − số thập phân'],
ex:`<p>Hai số “bù” nhau khi cộng lại tròn 100 (hoặc 1.000, hoặc 1). Đây là phản xạ quan trọng nhất cho phép trừ, thối tiền, và phần trăm (giảm 37% thì còn 63%).</p>
<h3>Cách tìm nhanh</h3>
<p>Chữ số hàng chục bù cho đủ <b>9</b>, chữ số hàng đơn vị bù cho đủ <b>10</b>.</p>
<div class="ex">Bù 100 của 37: (9 − 3)(10 − 7) = 63<br>Bù 1.000 của 370: bỏ số 0 → bù 100 của 37 là 63 → 630<br>1 − 0,37 = 0,63 (giảm 37% → còn 63%)</div>`,
gen(l){if(l===1){const x=nz(11,99);return{q:`100 − ${x}`,a:100-x,sol:buSol(x,100)}}
if(l===2){const x=ri(11,99)*10;return{q:`1.000 − ${f(x)}`,a:1000-x,sol:`Bỏ số 0 cuối: 100 − ${x/10} = ${100-x/10} → thêm lại số 0 → ${B(1000-x)}`}}
const x=nz(11,99);return{q:`1 − ${f(x/100)}`,a:r2(1-x/100),sol:`Coi như 100 − ${x} = ${100-x} → 1 − ${f(x/100)} = ${B(r2(1-x/100))}`}}},

{id:'so0',g:0,name:'Bỏ số 0 — tính xong mới gắn lại',short:'30 × 400 = 3 × 4 rồi gắn 3 số 0. Rất quan trọng với tiền VND.',lv:['Số tròn','Số 2 chữ số tròn','Tiền: nghìn → triệu'],
ex:`<p>Đếm tổng số chữ số 0 ở cuối các thừa số, nhân phần còn lại, rồi gắn đủ số 0 vào sau kết quả.</p>
<div class="ex">30 × 400 → 3 × 4 = 12, có 3 số 0 → 12.000<br>120 × 3.000 → 12 × 3 = 36, có 4 số 0 → 360.000</div>
<h3>Với tiền: đổi đơn vị để bớt số 0</h3>
<p>1 triệu = 1.000 nghìn; 1 tỷ = 1.000 triệu. Tính bằng nghìn, cuối cùng đổi sang triệu.</p>
<div class="ex">250 nghìn × 1.200 sản phẩm = 300.000 nghìn = <b>300 triệu</b></div>
<div class="warn">Lỗi hay gặp: đếm thiếu/thừa số 0. Luôn ước lượng độ lớn trước: “vài trăm nghìn × hơn nghìn cái = vài trăm triệu”.</div>`,
gen(l){if(l<3){let a,b;if(l===1){a=ri(2,9)*10**ri(1,2);b=ri(2,9)*10**ri(1,3)}else{a=nz(11,99)*10**ri(0,2);b=ri(2,9)*10**ri(1,3)}
const[ca,za]=strip0(a),[cb,zb]=strip0(b);return{q:`${f(a)} × ${f(b)}`,a:a*b,sol:`${ca} × ${cb} = ${f(ca*cb)}, có ${za+zb} số 0 → ${B(a*b)}`}}
const p=pick([15,25,35,45,120,150,250,350,450,800]),qt=pick([40,60,80,120,200,300,400,1500,2400,3000]);
return{q:`${p} nghìn đ × ${f(qt)} sản phẩm = ?`,u:'triệu đ',a:r2(p*qt/1000),sol:`${p} × ${f(qt)} = ${f(p*qt)} nghìn = ${B(r2(p*qt/1000))} triệu (1.000 nghìn = 1 triệu)`}}},

{id:'tach',g:0,name:'Tách số (nhân phân phối)',short:'7 × 48 = 7 × 40 + 7 × 8. Phương pháp vạn năng khi không có mẹo.',lv:['1 chữ số × 2 chữ số','1 chữ số × 3 chữ số','11–19 × 2 chữ số'],
ex:`<p>Quy tắc: <span class="k">a × (b + c) = a × b + a × c</span>. Tách số lớn theo hàng (trăm, chục, đơn vị) rồi tính từ trái sang phải, cộng dồn.</p>
<div class="ex">7 × 48 = 7 × 40 + 7 × 8 = 280 + 56 = 336<br>6 × 347 = 1.800 + 240 + 42 = 2.082<br>14 × 36 = 10 × 36 + 4 × 36 = 360 + 144 = 504</div>
<h3>Mẹo: tách thành hiệu khi gần số tròn</h3>
<div class="ex">7 × 49 = 7 × 50 − 7 = 343 &nbsp;·&nbsp; 8 × 198 = 1.600 − 16 = 1.584</div>`,
gen(l){if(l<3){const a=ri(3,9),b=l===1?nz(12,99):nz(102,999);const ps=placeParts(b);
return{q:`${a} × ${f(b)}`,a:a*b,sol:`${a} × ${f(b)} = ${ps.map(p=>`${a}×${f(p)}`).join(' + ')} = ${ps.map(p=>f(a*p)).join(' + ')} = ${B(a*b)}`}}
const a=ri(11,19),b=ri(21,99);return{q:`${a} × ${b}`,a:a*b,sol:`${a} × ${b} = 10 × ${b} + ${a-10} × ${b} = ${f(10*b)} + ${f((a-10)*b)} = ${B(a*b)}`}}},

// ---------- NHÓM 1 ----------
{id:'congtrai',g:1,name:'Cộng từ trái sang phải',short:'Giữ số thứ nhất, cộng dần từng hàng của số thứ hai.',lv:['2 chữ số','3 chữ số','4 chữ số'],
ex:`<p>Trên giấy ta cộng từ phải sang trái, nhưng khi nhẩm thì làm ngược lại: <b>giữ nguyên số thứ nhất</b>, rồi cộng lần lượt phần trăm, phần chục, phần đơn vị của số thứ hai.</p>
<div class="ex">456 + 378: 456 → +300 = 756 → +70 = 826 → +8 = <b>834</b></div>
<p>Ưu điểm: con số lớn (quan trọng nhất) có ngay; bạn chỉ phải nhớ <b>một</b> số tạm tại mỗi bước.</p>
<div class="warn">Luyện nói thầm số tạm: “bảy trăm năm sáu… tám trăm hai sáu… tám trăm ba tư”.</div>`,
gen(l){const[lo,hi]=l===1?[12,99]:l===2?[102,999]:[1002,9999];const a=nz(lo,hi),b=nz(lo,hi);let cur=a;const st=[f(a)];
for(const p of placeParts(b)){cur+=p;st.push(`+${f(p)} → ${f(cur)}`)}return{q:`${f(a)} + ${f(b)}`,a:a+b,sol:st.join(' ')+` = ${B(a+b)}`}}},

{id:'congtron',g:1,name:'Cộng số gần tròn (làm tròn – bù)',short:'567 + 198 = 567 + 200 − 2.',lv:['+ 97…99','+ 296…899','+ 1.995…8.999'],
ex:`<p>Số như 98, 199, 397, 2.996 nằm sát một số tròn. Cộng số tròn trước (rất dễ), rồi trừ lại phần đã cộng thừa.</p>
<div class="ex">567 + 198 = 567 + 200 − 2 = 767 − 2 = <b>765</b><br>3.450 + 2.997 = 3.450 + 3.000 − 3 = <b>6.447</b></div>
<p>Ứng dụng: giá 199k, 299k, 1.999k… trong bán lẻ.</p>`,
gen(l){let a,R,d;if(l===1){a=ri(21,99);R=100;d=ri(1,3)}else if(l===2){a=ri(101,999);R=ri(3,9)*100;d=ri(1,4)}else{a=ri(1001,9999);R=ri(2,9)*1000;d=ri(1,5)}
const b=R-d;return{q:`${f(a)} + ${f(b)}`,a:a+b,sol:`${f(b)} = ${f(R)} − ${d} → ${f(a)} + ${f(R)} − ${d} = ${f(a+R)} − ${d} = ${B(a+b)}`}}},

{id:'ghepcap',g:1,name:'Ghép cặp tròn trăm khi cộng dãy số',short:'Cộng nhiều số: tìm các cặp có tổng tròn trước.',lv:['4 số','6 số','5 số, cặp tròn 1.000'],
ex:`<p>Khi cộng một dãy, đừng cộng lần lượt từ trái sang. Quét qua dãy và tìm các cặp có tổng tròn (100, 1.000) — dùng phản xạ <b>cặp bù</b> ở Nhóm 0.</p>
<div class="ex">17 + 45 + 83 + 55 = (17 + 83) + (45 + 55) = 100 + 100 = <b>200</b></div>
<p>Ứng dụng: cộng hóa đơn nhiều món, cộng doanh thu các ngày.</p>`,
gen(l){const mk=base=>{const x=base===100?nz(11,89):nz(101,899);return[x,base-x]};
const pairs=l===1?[mk(100),mk(100)]:l===2?[mk(100),mk(100),mk(100)]:[mk(1000),mk(1000)];
let nums=pairs.flat();let extra=null;if(l===3){extra=ri(11,99);nums.push(extra)}shuffle(nums);const s=nums.reduce((a,b)=>a+b,0);
let sol=pairs.map(p=>`(${f(p[0])} + ${f(p[1])})`).join(' + ')+(extra?` + ${extra}`:'')+' = '+pairs.map(p=>f(p[0]+p[1])).join(' + ')+(extra?` + ${extra}`:'')+` = ${B(s)}`;
return{q:nums.map(f).join(' + '),a:s,sol}}},

{id:'tru910',g:1,name:'Trừ từ 1.000, 10.000 (quy tắc 9–9–10)',short:'10.000 − 3.746: lấy 9 trừ từng chữ số, chữ số cuối lấy 10 trừ.',lv:['1.000 − x','10.000 − x','100.000 − x'],
ex:`<p>Với phép trừ từ số tròn (1.000, 10.000…), không cần “mượn” từng hàng. Lấy <b>9</b> trừ từng chữ số, riêng chữ số cuối cùng (khác 0) lấy <b>10</b> trừ.</p>
<div class="ex">10.000 − 3.746 → (9−3)(9−7)(9−4)(10−6) = <b>6.254</b></div>
<p>Nếu số bị trừ có ít chữ số hơn, thêm 0 phía trước:</p>
<div class="ex">1.000 − 45 = 1.000 − 045 → (9−0)(9−4)(10−5) = <b>955</b></div>`,
gen(l){const base=l===1?1000:l===2?10000:100000;const x=l===1?nz(101,999):l===2?nz(1001,9999):(Math.random()<.3?nz(1001,9999):nz(10001,99999));
return{q:`${f(base)} − ${f(x)}`,a:base-x,sol:buSol(x,base)}}},

{id:'demlen',g:1,name:'Đếm lên (cách thối tiền)',short:'1.000 − 368: đi từ 368 lên 370, 400, rồi 1.000.',lv:['Từ 100–500','Từ 1.000–5.000','Thối tiền thật'],
ex:`<p>Muốn tính A − B, hãy <b>đi từ B lên A</b> theo các bậc tròn (lên chục, lên trăm, lên nghìn) rồi cộng các bước lại. Đây chính là cách người bán hàng thối tiền.</p>
<div class="ex">1.000 − 368: 368 → 370 (+2) → 400 (+30) → 1.000 (+600). Cộng: 2 + 30 + 600 = <b>632</b></div>
<p>Rất hợp khi số bị trừ là số tròn: thối tiền, tính còn thiếu bao nhiêu để đạt chỉ tiêu.</p>`,
gen(l){let R,b;if(l===1){R=pick([100,200,500]);b=nz(11,R-1)}else if(l===2){R=pick([1000,2000,5000]);b=nz(101,R-1)}else{R=pick([200,500,1000]);b=nz(Math.ceil(R*.3),R-1)}
const st=countUp(b,R);const sol=`${f(b)} `+st.map(s=>`→ ${f(s[0])} (+${f(s[1])})`).join(' ')+`. Cộng các bước: ${st.map(s=>f(s[1])).join(' + ')} = ${B(R-b)}`;
if(l===3)return{q:`Hóa đơn ${f(b)} nghìn đ, khách đưa ${f(R)} nghìn đ. Thối lại bao nhiêu?`,u:'nghìn đ',a:R-b,sol};
return{q:`${f(R)} − ${f(b)}`,a:R-b,sol}}},

{id:'trugan',g:1,name:'Trừ số gần tròn',short:'832 − 397 = 832 − 400 + 3.',lv:['− 97…99','− 296…899','− 1.995…8.999'],
ex:`<p>Trừ số tròn rồi <b>cộng lại</b> phần đã trừ thừa.</p>
<div class="ex">832 − 397 = 832 − 400 + 3 = 432 + 3 = <b>435</b></div>
<div class="warn">Nhớ dấu: trừ thừa bao nhiêu thì cộng lại bấy nhiêu (ngược với phép cộng gần tròn).</div>`,
gen(l){let a,R,d;if(l===1){R=100;d=ri(1,3);a=ri(120,999)}else if(l===2){R=ri(3,9)*100;d=ri(1,4);a=ri(R+50,R+2000)}else{R=ri(2,9)*1000;d=ri(1,5);a=ri(R+500,R+40000)}
const b=R-d;return{q:`${f(a)} − ${f(b)}`,a:a-b,sol:`${f(b)} = ${f(R)} − ${d} → ${f(a)} − ${f(R)} + ${d} = ${f(a-R)} + ${d} = ${B(a-b)}`}}},

// ---------- NHÓM 2 ----------
{id:'x5',g:2,name:'Nhân 5 và 50',short:'× 5 = × 10 rồi chia đôi.',lv:['2 chữ số × 5','2 chữ số × 50','3 chữ số × 5 / 50'],
ex:`<p>Vì 5 = 10 ÷ 2 nên <span class="k">× 5 = × 10 ÷ 2</span>; tương tự <span class="k">× 50 = × 100 ÷ 2</span>.</p>
<div class="ex">68 × 5 = 680 ÷ 2 = <b>340</b><br>47 × 5 = 470 ÷ 2 = <b>235</b><br>47 × 50 = 4.700 ÷ 2 = <b>2.350</b></div>
<p>Mẹo chia đôi số lẻ: 470 ÷ 2 = 400÷2 + 70÷2 = 200 + 35.</p>`,
gen(l){let n,m;if(l===1){n=ri(11,99);m=5}else if(l===2){n=ri(11,99);m=50}else{n=ri(101,999);m=pick([5,50])}const Z=m===5?10:100;
return{q:`${f(n)} × ${m}`,a:n*m,sol:`× ${m} = × ${Z} ÷ 2 → ${f(n*Z)} ÷ 2 = ${B(n*m)}`}}},

{id:'x25',g:2,name:'Nhân 25',short:'× 25 = × 100 rồi chia 4 (chia đôi hai lần).',lv:['Bội của 4','2 chữ số bất kỳ','3 chữ số'],
ex:`<p>Vì 25 = 100 ÷ 4 nên <span class="k">× 25 = × 100 ÷ 4</span>. Chia 4 = chia đôi hai lần.</p>
<div class="ex">36 × 25 = 3.600 ÷ 4 = <b>900</b><br>37 × 25 = 3.700 → ÷2 = 1.850 → ÷2 = <b>925</b></div>
<p>Cùng ý tưởng: × 2,5 = × 10 ÷ 4; × 0,25 = ÷ 4 (25% = một phần tư).</p>`,
gen(l){const n=l===1?ri(3,24)*4:l===2?ri(11,99):ri(101,999);return{q:`${f(n)} × 25`,a:n*25,sol:`× 25 = × 100 ÷ 4 → ${f(n*100)} → ÷2 = ${f(n*50)} → ÷2 = ${B(n*25)}`}}},

{id:'x125',g:2,name:'Nhân 125',short:'× 125 = × 1.000 rồi chia 8 (chia đôi ba lần).',lv:['Bội của 8','2 chữ số','3 chữ số'],
ex:`<p>Vì 125 = 1.000 ÷ 8 nên <span class="k">× 125 = × 1.000 ÷ 8</span>, tức là chia đôi ba lần.</p>
<div class="ex">48 × 125 = 48.000 ÷ 8 = <b>6.000</b><br>36 × 125 = 36.000 → 18.000 → 9.000 → <b>4.500</b></div>
<p>Liên quan: 12,5% = 1/8. Thuộc 1/8 = 0,125; 3/8 = 0,375; 5/8 = 0,625; 7/8 = 0,875.</p>`,
gen(l){const n=l===1?ri(2,12)*8:l===2?ri(11,99):ri(101,400);return{q:`${f(n)} × 125`,a:n*125,sol:`× 125 = × 1.000 ÷ 8 (chia đôi 3 lần): ${f(n*1000)} → ${halves(n*1000,3)} → ${B(n*125)}`}}},

{id:'x9',g:2,name:'Nhân 9, 99, 999 (và 19, 49, 98…)',short:'× 99 = × 100 rồi trừ chính số đó.',lv:['× 9','× 99','× 999, 98, 19, 49, 199'],
ex:`<p>9 = 10 − 1; 99 = 100 − 1; 999 = 1.000 − 1. Nên <span class="k">n × 99 = n × 100 − n</span>.</p>
<div class="ex">46 × 99 = 4.600 − 46 = <b>4.554</b><br>23 × 9 = 230 − 23 = <b>207</b></div>
<h3>Mở rộng cho mọi số sát số tròn</h3>
<div class="ex">37 × 98 = 3.700 − 2 × 37 = 3.700 − 74 = 3.626<br>24 × 19 = 24 × 20 − 24 = 456 · 16 × 49 = 800 − 16 = 784</div>`,
gen(l){let n,m,R,d;if(l===1){n=ri(12,99);m=9;R=10;d=1}else if(l===2){n=ri(12,99);m=99;R=100;d=1}else{[m,R,d]=pick([[999,1000,1],[98,100,2],[19,20,1],[49,50,1],[199,200,1]]);n=m===999?ri(101,999):ri(12,99)}
return{q:`${f(n)} × ${m}`,a:n*m,sol:`${f(n)} × ${m} = ${f(n)} × ${f(R)} − ${d===1?f(n):`${d} × ${n}`} = ${f(n*R)} − ${f(n*d)} = ${B(n*m)}`}}},

{id:'x11',g:2,name:'Nhân 11',short:'53 × 11 → 5 | 5+3 | 3 = 583.',lv:['Tổng 2 chữ số < 10','Có nhớ','3 chữ số'],
ex:`<p>Với số hai chữ số <b>ab</b>: kết quả là <span class="k">a | a+b | b</span>.</p>
<div class="ex">53 × 11 → 5 | 8 | 3 = <b>583</b></div>
<p>Nếu a + b ≥ 10 thì nhớ 1 sang chữ số bên trái:</p>
<div class="ex">78 × 11 → 7 | 15 | 8 → 8 | 5 | 8 = <b>858</b></div>
<p>Số ba chữ số <b>abc</b>: <span class="k">a | a+b | b+c | c</span> (xử lý nhớ từ phải sang).</p>
<div class="ex">347 × 11 → 3 | 7 | 11 | 7 → <b>3.817</b></div>`,
gen(l){let n;if(l===1){const a=ri(1,8),b=ri(1,9-a);n=10*a+b}else if(l===2){const a=ri(1,9),b=ri(10-a,9);n=10*a+b}else n=ri(101,999);
const ds=String(n).split('').map(Number),parts=[ds[0]];for(let i=1;i<ds.length;i++)parts.push(ds[i-1]+ds[i]);parts.push(ds[ds.length-1]);
return{q:`${f(n)} × 11`,a:n*11,sol:`${parts.join(' | ')}${parts.some(p=>p>9)?' → nhớ 1 sang trái':''} → ${B(n*11)}`}}},

{id:'x101',g:2,name:'Nhân 101, 1.001',short:'47 × 101 = 4.747 — viết số đó hai lần.',lv:['2 chữ số × 101','3 chữ số × 1.001','3 chữ số × 101'],
ex:`<p>101 = 100 + 1 nên số hai chữ số nhân 101 chỉ cần <b>viết lại hai lần</b>.</p>
<div class="ex">47 × 101 = 4.700 + 47 = <b>4.747</b><br>385 × 1.001 = 385.000 + 385 = <b>385.385</b></div>
<p>Số ba chữ số nhân 101 thì cộng thật:</p>
<div class="ex">347 × 101 = 34.700 + 347 = <b>35.047</b></div>`,
gen(l){if(l===1){const n=ri(11,99);return{q:`${n} × 101`,a:n*101,sol:`${n} × 101 = ${f(n*100)} + ${n} → viết ${n} hai lần = ${B(n*101)}`}}
if(l===2){const n=ri(101,999);return{q:`${n} × 1.001`,a:n*1001,sol:`${n} × 1.001 = ${f(n*1000)} + ${n} → viết ${n} hai lần = ${B(n*1001)}`}}
const n=ri(101,999);return{q:`${n} × 101`,a:n*101,sol:`${n} × 101 = ${f(n*100)} + ${n} = ${B(n*101)}`}}},

{id:'x15',g:2,name:'Nhân 1,5 và 15',short:'× 1,5 = cộng thêm một nửa; × 15 = × 10 + một nửa.',lv:['2 chữ số × 1,5','3 chữ số × 1,5','2 chữ số × 15'],
ex:`<p><span class="k">× 1,5 = số đó + một nửa của nó</span> (tăng 50%).</p>
<div class="ex">840 × 1,5 = 840 + 420 = <b>1.260</b></div>
<p><span class="k">× 15 = × 10 + một nửa của (× 10)</span>.</p>
<div class="ex">46 × 15 = 460 + 230 = <b>690</b></div>`,
gen(l){if(l<3){const n=l===1?ri(6,49)*2:ri(51,499)*2;return{q:`${f(n)} × 1,5`,a:n*1.5,sol:`${f(n)} + một nửa (${f(n/2)}) = ${B(n*1.5)}`}}
const n=ri(12,99);return{q:`${n} × 15`,a:n*15,sol:`${n} × 10 = ${f(n*10)}; một nửa của nó = ${f(n*5)} → ${f(n*10)} + ${f(n*5)} = ${B(n*15)}`}}},

{id:'doichia',g:2,name:'Nhân đôi – chia đôi',short:'16 × 35 = 8 × 70. Tích không đổi.',lv:['× 15…45','× 15…95','× 125…375'],
ex:`<p>Chia đôi một thừa số và nhân đôi thừa số kia thì tích không đổi. Làm liên tục đến khi một số trở thành số tròn.</p>
<div class="ex">16 × 35 = 8 × 70 = <b>560</b><br>14 × 45 = 7 × 90 = <b>630</b><br>24 × 125 = 12 × 250 = 6 × 500 = <b>3.000</b></div>
<p>Đặc biệt hợp với số tận cùng bằng 5 (vì 5 × 2 = 10).</p>`,
gen(l){let p,q;if(l===1){q=pick([15,25,35,45]);p=ri(2,9)*2}else if(l===2){q=pick([15,25,35,45,55,65,75,85,95]);p=ri(3,24)*2}else{q=pick([125,175,225,375]);p=ri(2,12)*4}
const st=[`${p} × ${f(q)}`];let x=p,y=q;while(x%2===0&&y%10!==0){x/=2;y*=2;st.push(`${x} × ${f(y)}`)}
return{q:Math.random()<.5?`${f(q)} × ${p}`:`${p} × ${f(q)}`,a:p*q,sol:st.join(' = ')+` = ${B(p*q)}`}}},

{id:'hangdang',g:2,name:'Hằng đẳng thức (a − b)(a + b)',short:'49 × 51 = 50² − 1. Hai số cách đều một số tròn.',lv:['Quanh số tròn chục','Quanh bội của 5','Quanh số trăm'],
ex:`<p>Nếu hai số cách đều một số m: <span class="k">(m − d)(m + d) = m² − d²</span>.</p>
<div class="ex">49 × 51 = 50² − 1² = 2.500 − 1 = <b>2.499</b><br>38 × 42 = 40² − 2² = 1.600 − 4 = <b>1.596</b><br>43 × 47 = 45² − 2² = 2.025 − 4 = <b>2.021</b></div>
<p>Cách nhận diện: cộng hai số rồi chia đôi — nếu được số tròn (hoặc số dễ bình phương) thì dùng mẹo này.</p>`,
gen(l){let m,d;if(l===1){m=ri(2,9)*10;d=ri(1,3)}else if(l===2){m=ri(3,19)*5;d=ri(1,5)}else{m=ri(10,30)*10;d=ri(1,9)}
const a=m-d,b=m+d;return{q:Math.random()<.5?`${a} × ${b}`:`${b} × ${a}`,a:a*b,sol:`Hai số cách đều ${m}: ${m}² − ${d}² = ${f(m*m)} − ${d*d} = ${B(a*b)}`}}},

{id:'bp5',g:2,name:'Bình phương số tận cùng 5',short:'65² → 6 × 7 = 42, ghép 25 → 4.225.',lv:['15–95','105–195','205–995'],
ex:`<p>Với số có dạng <b>…5</b>: lấy phần đứng trước số 5 nhân với (chính nó + 1), rồi viết thêm <b>25</b> vào sau.</p>
<div class="ex">65² → 6 × 7 = 42 → <b>4.225</b><br>85² → 8 × 9 = 72 → <b>7.225</b><br>115² → 11 × 12 = 132 → <b>13.225</b></div>`,
gen(l){const t=l===1?ri(1,9):l===2?ri(10,19):ri(20,99);const n=t*10+5;return{q:`${f(n)}²`,a:n*n,sol:`${t} × ${t+1} = ${f(t*(t+1))}, ghép 25 → ${B(n*n)}`}}},

{id:'bp50',g:2,name:'Bình phương số gần 50 (và 500)',short:'48² → (25 − 2) ghép 2² → 2.304.',lv:['50 ± 1…5','50 ± 1…9','500 ± 1…15'],
ex:`<p>Với số 50 ± d: <span class="k">(50 ± d)² = (25 ± d) trăm + d²</span>. Viết d² thành 2 chữ số.</p>
<div class="ex">48² → 25 − 2 = 23 | 2² = 04 → <b>2.304</b><br>53² → 25 + 3 = 28 | 09 → <b>2.809</b><br>57² → 32 | 49 → <b>3.249</b></div>
<p>Gần 500: <span class="k">(500 ± d)² = (250 ± d) nghìn + d²</span> (d² viết 3 chữ số).</p>
<div class="ex">503² → 253 | 009 → <b>253.009</b></div>`,
gen(l){const s=Math.random()<.5?1:-1;if(l<3){const d=l===1?ri(1,5):ri(1,9);const n=50+s*d,h=25+s*d;return{q:`${n}²`,a:n*n,sol:`25 ${sgn(s)} ${d} = ${h}; ${d}² = ${pad(d*d)} → ghép: ${B(n*n)}`}}
const d=ri(1,15),n=500+s*d,h=250+s*d;return{q:`${n}²`,a:n*n,sol:`250 ${sgn(s)} ${d} = ${h}; ${d}² = ${pad(d*d,3)} → ghép: ${B(n*n)}`}}},

{id:'bpgan',g:2,name:'Bình phương số gần số tròn',short:'102² = 10.000 + 400 + 4.',lv:['Gần số tròn chục','Gần 100–300','Gần 400–1.000'],
ex:`<p><span class="k">(R ± d)² = R² ± 2·R·d + d²</span>, với R là số tròn.</p>
<div class="ex">102² = 10.000 + 400 + 4 = <b>10.404</b><br>98² = 10.000 − 400 + 4 = <b>9.604</b><br>61² = 3.600 + 120 + 1 = <b>3.721</b></div>
<p>Thứ tự nhẩm: R² trước → cộng/trừ 2·R·d → cộng d².</p>`,
gen(l){let R,d;if(l===1){R=ri(2,9)*10;d=ri(1,2)}else if(l===2){R=pick([100,200,300]);d=ri(1,6)}else{R=pick([ri(4,9)*100,1000]);d=ri(1,9)}
const s=Math.random()<.5?1:-1,n=R+s*d;return{q:`${f(n)}²`,a:n*n,sol:`(${f(R)} ${sgn(s)} ${d})² = ${f(R*R)} ${sgn(s)} 2 × ${f(R)} × ${d} + ${d}² = ${f(R*R)} ${sgn(s)} ${f(2*R*d)} + ${d*d} = ${B(n*n)}`}}},

{id:'cungchuc',g:2,name:'Cùng phần đầu, đuôi cộng lại bằng 10',short:'43 × 47 → 4 × 5 | 3 × 7 → 2.021.',lv:['2 chữ số','3 chữ số (đầu 10–19)','3 chữ số (đầu 20–99)'],
ex:`<p>Khi hai số có <b>cùng phần đầu</b> và <b>chữ số cuối cộng lại bằng 10</b>: lấy phần đầu × (phần đầu + 1), rồi ghép với tích hai chữ số cuối (viết 2 chữ số).</p>
<div class="ex">43 × 47 → 4 × 5 = 20 | 3 × 7 = 21 → <b>2.021</b><br>62 × 68 → 6 × 7 = 42 | 2 × 8 = 16 → <b>4.216</b><br>81 × 89 → 72 | 09 → <b>7.209</b><br>123 × 127 → 12 × 13 = 156 | 21 → <b>15.621</b></div>
<p>Bình phương số tận cùng 5 chính là trường hợp riêng của mẹo này (5 + 5 = 10).</p>`,
gen(l){const t=l===1?ri(1,9):l===2?ri(10,19):ri(20,99);const u=ri(1,9),a=t*10+u,b=t*10+(10-u);
return{q:`${f(a)} × ${f(b)}`,a:a*b,sol:`Phần đầu ${t}: ${t} × ${t+1} = ${f(t*(t+1))}; đuôi: ${u} × ${10-u} = ${pad(u*(10-u))} → ghép: ${B(a*b)}`}}},

{id:'coso',g:2,name:'Nhân hai số gần 100 (phương pháp cơ số)',short:'97 × 96 → 93 | 12 = 9.312.',lv:['Cả hai dưới 100','Cả hai trên 100','Một trên, một dưới'],
ex:`<p><b>Dưới 100:</b> tìm phần thiếu so với 100 (d₁, d₂). Lấy số thứ nhất trừ phần thiếu của số kia → hàng trăm; ghép với d₁ × d₂ (2 chữ số).</p>
<div class="ex">97 × 96: thiếu 3 và 4 → 97 − 4 = 93 | 3 × 4 = 12 → <b>9.312</b></div>
<p><b>Trên 100:</b> phần thừa e₁, e₂: số thứ nhất + phần thừa của số kia → hàng trăm; cộng e₁ × e₂.</p>
<div class="ex">103 × 107 → 103 + 7 = 110 | 3 × 7 = 21 → <b>11.021</b><br>112 × 109 → 121 trăm + 108 = <b>12.208</b></div>
<p><b>Một trên, một dưới:</b> tính như trên rồi <i>trừ</i> tích phần thừa × phần thiếu.</p>
<div class="ex">104 × 97 → (104 − 3) trăm − 4 × 3 = 10.100 − 12 = <b>10.088</b></div>`,
gen(l){let a,b;if(l===1){a=ri(91,99);b=ri(91,99)}else if(l===2){a=ri(101,115);b=ri(101,115)}else{a=ri(101,112);b=ri(88,99)}
const da=a-100,db=b-100,X=a+db,p=da*db;let sol;
if(l===1)sol=`Thiếu ${-da} và ${-db} → ${a} − ${-db} = ${X}; ${-da} × ${-db} = ${pad(p)} → ${X} | ${pad(p)} = ${B(a*b)}`;
else if(l===2)sol=`Thừa ${da} và ${db} → ${a} + ${db} = ${X}; ${da} × ${db} = ${p} → ${p<100?`${X} | ${pad(p)}`:`${X} trăm + ${p}`} = ${B(a*b)}`;
else sol=`${a} thừa ${da}, ${b} thiếu ${-db} → ${a} − ${-db} = ${X} trăm = ${f(X*100)}; trừ ${da} × ${-db} = ${-p} → ${B(a*b)}`;
return{q:`${a} × ${b}`,a:a*b,sol}}},

{id:'tongquat',g:2,name:'Nhân tổng quát 2 chữ số × 2 chữ số',short:'Khi không có mẹo: tách một số, tính từ trái sang phải.',lv:['11–19 × 2 chữ số','2 chữ số bất kỳ','Cả hai từ 51–99'],
ex:`<p>Khi không nhận ra mẹo đặc biệt nào, tách <b>số thứ hai</b> thành chục + đơn vị và giữ tổng tạm trong đầu.</p>
<div class="ex">67 × 34 = 67 × 30 + 67 × 4 = 2.010 + 268 = <b>2.278</b></div>
<p>Nếu số thứ hai tận cùng là 8 hoặc 9, dùng phép trừ sẽ nhanh hơn:</p>
<div class="ex">67 × 39 = 67 × 40 − 67 = 2.680 − 67 = <b>2.613</b></div>
<div class="warn">Trước khi tách, liếc qua các mẹo: có cách đều số tròn không? Có gần 100 không? Có số tận cùng 5 không? Đây là kỹ năng “nhận dạng” — luyện ở phần Luyện tổng hợp.</div>`,
gen(l){const a=l===1?ri(11,19):l===2?ri(21,99):ri(51,99),b=l===1?ri(12,99):l===2?ri(21,99):ri(51,99);const u=b%10;let sol;
if(u>=8){const R=b+(10-u);sol=`${a} × ${b} = ${a} × ${R} − ${a} × ${R-b} = ${f(a*R)} − ${f(a*(R-b))} = ${B(a*b)}`}
else if(u===0)sol=`${a} × ${b} = ${a} × ${b/10} × 10 = ${B(a*b)}`;
else sol=`${a} × ${b} = ${a} × ${b-u} + ${a} × ${u} = ${f(a*(b-u))} + ${f(a*u)} = ${B(a*b)}`;
return{q:`${a} × ${b}`,a:a*b,sol}}},

// ---------- NHÓM 3 ----------
{id:'chia5',g:3,name:'Chia cho 5, 25, 125',short:'÷ 5 = × 2 ÷ 10. Đổi phép chia thành phép nhân.',lv:['÷ 5','÷ 25','÷ 125'],
ex:`<p>Chia cho 5, 25, 125 khó; nhân với 2, 4, 8 thì dễ. Vì vậy:</p>
<ul><li><span class="k">÷ 5 = × 2 ÷ 10</span>: 740 ÷ 5 = 1.480 ÷ 10 = <b>148</b></li>
<li><span class="k">÷ 25 = × 4 ÷ 100</span>: 1.300 ÷ 25 = 5.200 ÷ 100 = <b>52</b></li>
<li><span class="k">÷ 125 = × 8 ÷ 1.000</span>: 3.000 ÷ 125 = 24.000 ÷ 1.000 = <b>24</b></li></ul>`,
gen(l){let d,n;if(l===1){d=5;n=ri(13,199)*5}else if(l===2){d=25;n=ri(5,99)*25}else{d=125;n=ri(3,80)*125}const m=d===5?2:d===25?4:8,Z=d===5?10:d===25?100:1000;
return{q:`${f(n)} ÷ ${d}`,a:n/d,sol:`÷ ${d} = × ${m} ÷ ${f(Z)} → ${f(n)} × ${m} = ${f(n*m)} → ÷ ${f(Z)} = ${B(n/d)}`}}},

{id:'rutgon',g:3,name:'Rút gọn hai vế',short:'840 ÷ 24 → 420 ÷ 12 → 140 ÷ 4 → 35.',lv:['Chia cho 12–18','Chia cho 24–48','Chia cho 64–144'],
ex:`<p>Chia cả số bị chia và số chia cho <b>cùng một số</b> (2, 3, 5…) thì thương không đổi. Rút gọn đến khi số chia còn 1 chữ số.</p>
<div class="ex">840 ÷ 24 → (÷2) 420 ÷ 12 → (÷3) 140 ÷ 4 → <b>35</b><br>1.350 ÷ 45 → (÷5) 270 ÷ 9 → <b>30</b></div>
<p>Dùng dấu hiệu chia hết (bài cuối nhóm này) để biết nên chia cho số nào.</p>`,
gen(l){const d=pick(l===1?[12,14,15,16,18]:l===2?[24,32,36,45,48]:[64,72,96,108,144]);const q=l===1?ri(11,40):l===2?ri(12,60):ri(12,99);const n=q*d;let x=n,y=d;const st=[`${f(n)} ÷ ${d}`];
while(y>9){const fc=[2,3,5,7].find(p=>y%p===0&&x%p===0);if(!fc)break;x/=fc;y/=fc;st.push(`(÷${fc}) ${f(x)} ÷ ${y}`)}
return{q:`${f(n)} ÷ ${d}`,a:q,sol:st.join(' → ')+` = ${B(q)}`}}},

{id:'tachchia',g:3,name:'Tách số bị chia',short:'912 ÷ 8 = (800 + 112) ÷ 8 = 100 + 14.',lv:['÷ 2–5','÷ 6–9','÷ 11–19'],
ex:`<p>Tách số bị chia thành các phần <b>chia hết dễ dàng</b> cho số chia, rồi cộng các thương lại.</p>
<div class="ex">912 ÷ 8 = (800 + 112) ÷ 8 = 100 + 14 = <b>114</b><br>1.428 ÷ 14 = (1.400 + 28) ÷ 14 = 100 + 2 = <b>102</b><br>2.856 ÷ 7 = (2.800 + 56) ÷ 7 = 400 + 8 = <b>408</b></div>`,
gen(l){let d,q;if(l===1){d=ri(2,5);q=ri(21,199)}else if(l===2){d=ri(6,9);q=ri(101,999)}else{d=ri(11,19);q=ri(101,499)}
const n=q*d,k=String(q).length-1,h=Math.floor(q/10**k)*10**k,m=d*h,r=n-m;
return{q:`${f(n)} ÷ ${d}`,a:q,sol:r===0?`${f(n)} ÷ ${d} = ${B(q)}`:`${f(n)} = ${f(m)} + ${f(r)} → ${f(m)} ÷ ${d} = ${f(h)}; ${f(r)} ÷ ${d} = ${f(r/d)} → ${f(h)} + ${f(r/d)} = ${B(q)}`}}},

{id:'chiahet',g:3,name:'Dấu hiệu chia hết & số dư',short:'Biết ngay số chia hết cho 3, 4, 8, 9, 11 hay không.',lv:['÷ 3, 9','÷ 4, 8, 9','÷ 8, 9, 11'],
ex:`<ul><li><b>2, 5, 10</b>: nhìn chữ số cuối.</li>
<li><b>3, 9</b>: tổng các chữ số. Số dư khi chia 9 = số dư của tổng chữ số khi chia 9.</li>
<li><b>4</b>: chỉ xét 2 chữ số cuối. <b>8</b>: chỉ xét 3 chữ số cuối.</li>
<li><b>11</b>: từ phải sang trái, cộng trừ đan xen các chữ số (+ − + −…).</li></ul>
<div class="ex">5.832: tổng 5+8+3+2 = 18 → chia hết cho 9<br>73.516: 2 số cuối 16 → chia hết cho 4; 3 số cuối 516 ÷ 8 dư 4<br>918.082: 2 − 8 + 0 − 8 + 1 − 9 = −22 → chia hết cho 11</div>
<p>Bài tập ở đây hỏi <b>số dư</b> để bạn luyện đúng quy tắc.</p>`,
gen(l){const d=pick(l===1?[3,9]:l===2?[4,8,9]:[11,8,9,11]);const N=l===1?ri(100,9999):l===2?ri(1000,99999):ri(10000,999999);const s=String(N);let sol;
if(d===3||d===9){const S=[...s].reduce((a,c)=>a+ +c,0);sol=`Tổng chữ số: ${[...s].join(' + ')} = ${S} → ${S} chia ${d} dư ${B(S%d)}`}
else if(d===4){const t=N%100;sol=`Chỉ xét 2 chữ số cuối: ${pad(t)} chia 4 dư ${B(t%4)}`}
else if(d===8){const t=N%1000;sol=`Chỉ xét 3 chữ số cuối: ${pad(t,3)} chia 8 dư ${B(t%8)}`}
else{const ds=[...s].reverse().map(Number);const alt=ds.reduce((a,c,i)=>a+(i%2?-c:c),0);const rem=((alt%11)+11)%11;
sol=`Từ phải sang, đan dấu: ${ds.map((c,i)=>(i===0?'':(i%2?' − ':' + '))+c).join('')} = ${alt} → chia 11 dư ${B(rem)}${alt<0?' (kết quả âm thì cộng thêm 11)':''}`}
return{q:`Số dư khi chia ${f(N)} cho ${d}`,a:N%d,sol}}},

// ---------- NHÓM 4 ----------
{id:'quydoi',g:4,name:'Quy đổi phân số ↔ phần trăm',short:'Thuộc lòng 1/8 = 12,5%, 1/6 ≈ 16,7%…',lv:['1/2, 1/4, 1/5, 1/10…','+ 1/3, 1/6, 1/8','+ 1/7, 1/9, 1/12, 1/16'],
ex:`<p>Bảng này phải thuộc như bảng cửu chương — nó biến phép chia thành phép nhận dạng.</p>
<div class="tbwrap"><table class="tb">
<tr><th>1/2</th><th>1/3</th><th>1/4</th><th>1/5</th><th>1/6</th><th>1/7</th><th>1/8</th><th>1/9</th><th>1/10</th><th>1/12</th><th>1/16</th><th>1/20</th></tr>
<tr><td>50%</td><td>33,3%</td><td>25%</td><td>20%</td><td>16,7%</td><td>14,3%</td><td>12,5%</td><td>11,1%</td><td>10%</td><td>8,33%</td><td>6,25%</td><td>5%</td></tr></table></div>
<p>Phân số có tử khác 1: nhân lên. <span class="k">3/8 = 3 × 12,5% = 37,5%</span>; <span class="k">5/6 = 5 × 16,7% ≈ 83,3%</span>.</p>
<p>Ứng dụng ngược: “33% khách hàng” ≈ 1/3; “12,5% chiết khấu” = 1/8 giá.</p>
<div class="warn">Đáp án trong khoảng ±0,1% được tính đúng (ví dụ 1/3 nhập 33,3).</div>`,
gen(l){const L1=[[1,2],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,10],[3,10],[7,10],[1,20],[1,25]],L2=[[1,3],[2,3],[1,8],[3,8],[5,8],[7,8],[1,6],[5,6]],L3=[[1,7],[2,7],[1,9],[2,9],[1,12],[5,12],[1,16],[3,16],[1,40],[3,40],[1,11]];
const[a,b]=pick(l===1?L1:l===2?L1.concat(L2):L2.concat(L3));const v=Math.round(10000*a/b)/100,u=Math.round(10000/b)/100;
return{q:`${a}/${b} =`,u:'%',a:v,tol:.1,sol:a===1?`1/${b} = 100 ÷ ${b} = ${B(v)}%`:`1/${b} = ${f(u)}% → ${a} × ${f(u)}% ≈ ${B(v)}%`}}},

{id:'pt10',g:4,name:'Tính % qua 10% và 1%',short:'15% của 840 = 84 + 42 = 126.',lv:['10%, 20%, 25%, 50%…','15%, 35%, 12%…','7%, 13%, 18%, 27%…'],
ex:`<p>Mọi phần trăm đều ghép được từ hai “viên gạch”:</p>
<ul><li><b>10%</b> = dời dấu phẩy sang trái 1 chữ số (840 → 84)</li><li><b>1%</b> = dời 2 chữ số (840 → 8,4)</li></ul>
<div class="ex">15% = 10% + 5% (nửa của 10%): 15% của 840 = 84 + 42 = <b>126</b><br>7% của 640 = 7 × 6,4 = <b>44,8</b><br>18% = 20% − 2%: 18% của 350 = 70 − 7 = <b>63</b></div>`,
gen(l){const p=pick(l===1?[10,20,5,50,25,30]:l===2?[15,35,45,12,2,3,40,60]:[7,13,17,18,27,8,19,23]);const N=l===1?ri(2,50)*20:l===2?ri(11,99)*10:ri(101,999);
return{q:`${p}% của ${f(N)}`,a:r2(p*N/100),sol:pctSol(p,N)}}},

{id:'hoandoi',g:4,name:'Hoán đổi phần trăm',short:'8% của 50 = 50% của 8 = 4.',lv:['… của 50, 25, 10','… của 20, 75, 40','… của 125, 150, 250'],
ex:`<p><span class="k">x% của y = y% của x</span> (vì cả hai đều bằng x × y ÷ 100). Hãy đảo sang chiều dễ hơn.</p>
<div class="ex">8% của 50 = 50% của 8 = <b>4</b><br>16% của 25 = 25% của 16 = <b>4</b><br>36% của 75 = 75% của 36 = <b>27</b></div>`,
gen(l){const opts=l===1?[[50,'lấy một nửa',x=>x/2],[25,'lấy một phần tư',x=>x/4],[10,'chia 10',x=>x/10]]:l===2?[[20,'chia 5',x=>x/5],[75,'lấy ba phần tư',x=>x*3/4],[40,'nhân 2 rồi chia 5',x=>x*2/5]]:[[150,'nhân 1,5',x=>x*1.5],[250,'nhân 2,5',x=>x*2.5],[125,'nhân 1,25',x=>x*1.25]];
const[e,txt]=pick(opts);const a=ri(2,24)*4;const ans=r2(a*e/100);return{q:`${a}% của ${e}`,a:ans,sol:`${a}% của ${e} = ${e}% của ${a} → ${a} ${txt} = ${B(ans)}`}}},

{id:'giam',g:4,name:'Giảm giá liên tiếp',short:'Giảm 20% rồi 10% = giảm 28%, không phải 30%.',lv:['10%, 20%, 50%','Bội của 5','Tính giá cuối'],
ex:`<p>Các lần giảm giá <b>nhân</b> với nhau chứ không cộng. Giảm p% nghĩa là còn lại (100 − p)%.</p>
<div class="ex">Giảm 20% rồi 10%: còn 0,8 × 0,9 = 0,72 → tổng giảm <b>28%</b><br>Giảm 50% rồi 20%: còn 0,5 × 0,8 = 0,4 → tổng giảm <b>60%</b></div>
<div class="warn">Bẫy khuyến mãi “giảm 30% + thêm 20%” chỉ là giảm 44%, không phải 50%.</div>`,
gen(l){if(l<3){const p1=l===1?pick([10,20,50]):ri(1,8)*5,p2=l===1?pick([10,20,50]):ri(1,8)*5;const keep=(100-p1)*(100-p2)/100;
return{q:`Giảm ${p1}% rồi giảm tiếp ${p2}%. Tổng cộng giảm bao nhiêu %?`,u:'%',a:r2(100-keep),sol:`Còn lại ${f((100-p1)/100)} × ${f((100-p2)/100)} = ${f(keep/100)} → giảm ${B(r2(100-keep))}% (không phải ${p1+p2}%)`}}
const P0=ri(1,10)*400,p1=ri(1,8)*5,p2=ri(1,8)*5;const mid=P0*(100-p1)/100,fin=P0*(100-p1)*(100-p2)/10000;
return{q:`Giá ${f(P0)} nghìn đ, giảm ${p1}% rồi giảm tiếp ${p2}%. Giá cuối?`,u:'nghìn đ',a:fin,sol:`${f(P0)} × ${f((100-p1)/100)} = ${f(mid)} → × ${f((100-p2)/100)} = ${B(fin)}`}}},

{id:'tanggiam',g:4,name:'Tăng rồi giảm (bẫy phần trăm)',short:'+20% rồi −20% = 96%, tức lỗ 4%.',lv:['Cùng tỷ lệ','Bội của 10','Bội của 5'],
ex:`<p>Tăng a% = nhân (1 + a%); giảm b% = nhân (1 − b%). Nhân hai hệ số lại.</p>
<div class="ex">Tăng 20% rồi giảm 20%: 1,2 × 0,8 = 0,96 → còn <b>96%</b> (giảm 4%)<br>Tăng 30% rồi giảm 20%: 1,3 × 0,8 = 1,04 → <b>104%</b> (tăng 4%)</div>
<p>Quy tắc nhanh khi cùng tỷ lệ a%: luôn giảm <span class="k">a² ÷ 100</span> phần trăm (20% → giảm 4%; 30% → giảm 9%).</p>`,
gen(l){let a,b;if(l===1){a=b=pick([10,20,30,50])}else if(l===2){a=ri(1,5)*10;b=ri(1,5)*10}else{a=ri(1,10)*5;b=ri(1,10)*5}
const res=r2((100+a)*(100-b)/100),ch=r2(res-100);
return{q:`Tăng ${a}% rồi giảm ${b}%. Giá cuối bằng bao nhiêu % giá ban đầu?`,u:'%',a:res,sol:`${f(1+a/100)} × ${f(1-b/100)} = ${f(res/100)} → ${B(res)}% (tức ${ch>=0?'tăng':'giảm'} ${f(Math.abs(ch))}%)`}}},

{id:'vat',g:4,name:'Tách thuế VAT',short:'Giá đã gồm VAT 10% → giá trước thuế = giá ÷ 1,1.',lv:['VAT 10%','VAT 8%','Tính tiền thuế'],
ex:`<p>Giá đã có thuế = giá trước thuế × (1 + thuế suất). Muốn tách thuế thì <b>chia</b>, không phải trừ 10%.</p>
<ul><li>VAT 10%: <span class="k">trước thuế = tổng ÷ 1,1</span> — mẹo: ÷ 11 rồi × 10</li>
<li>VAT 8%: <span class="k">trước thuế = tổng ÷ 1,08</span> ≈ tổng × 0,926</li>
<li>Tiền thuế 10% = tổng ÷ 11 (vì thuế chiếm 10/110 của tổng)</li></ul>
<div class="ex">Hóa đơn 1.320 nghìn (gồm VAT 10%): 1.320 ÷ 11 = 120 → × 10 = <b>1.200 nghìn</b>; thuế = 120 nghìn</div>
<div class="warn">Sai lầm phổ biến: 1.320 − 10% = 1.188 (sai!). Vì 10% được tính trên giá trước thuế, không phải trên tổng.</div>`,
gen(l){if(l===1){const base=ri(2,50)*100,tot=base*11/10;return{q:`Giá đã gồm VAT 10%: ${f(tot)} nghìn đ. Giá trước thuế?`,u:'nghìn đ',a:base,sol:`${f(tot)} ÷ 1,1 → ÷ 11 = ${f(tot/11)} → × 10 = ${B(base)}`}}
if(l===2){const base=ri(4,80)*25,tot=base*27/25;return{q:`Giá đã gồm VAT 8%: ${f(tot)} nghìn đ. Giá trước thuế?`,u:'nghìn đ',a:base,sol:`${f(tot)} ÷ 1,08 = ${B(base)} (kiểm tra: ${f(base)} + 8% = ${f(base)} + ${f(base*.08)} = ${f(tot)})`}}
const rate=pick([8,10]);const base=rate===10?ri(2,50)*100:ri(4,80)*25;const tot=rate===10?base*11/10:base*27/25;
return{q:`Hóa đơn ${f(tot)} nghìn đ đã gồm VAT ${rate}%. Tiền thuế là bao nhiêu?`,u:'nghìn đ',a:tot-base,sol:rate===10?`Thuế = tổng ÷ 11 = ${f(tot)} ÷ 11 = ${B(tot-base)}`:`Trước thuế = ${f(tot)} ÷ 1,08 = ${f(base)} → thuế = ${f(tot)} − ${f(base)} = ${B(tot-base)}`}}},

// ---------- NHÓM 5 ----------
{id:'uocluong',g:5,name:'Ước lượng nhanh',short:'Làm tròn về 1–2 chữ số có nghĩa rồi nhân.',lv:['2 × 3 chữ số (±10%)','3 × 3 chữ số (±8%)','4 × 3 chữ số (±5%)'],
ex:`<p>Trong kinh doanh, thường chỉ cần biết <b>đúng cỡ</b> trong 3 giây hơn là chính xác sau 30 giây.</p>
<ul><li>Làm tròn mỗi số về 1–2 chữ số có nghĩa: 4.870 → 4.900 (hoặc 5.000); 312 → 310 (hoặc 300).</li>
<li>Làm tròn một số lên, số kia xuống để sai số bù trừ nhau.</li>
<li>Đếm số 0 cẩn thận (xem bài “Bỏ số 0”).</li></ul>
<div class="ex">4.870 × 312 ≈ 4.900 × 310 = 1.519.000 (chính xác: 1.519.440)<br>Nhanh hơn: ≈ 5.000 × 300 = 1.500.000 — đúng cỡ “một triệu rưỡi”</div>
<div class="warn">Đáp án nằm trong khoảng sai số cho phép của từng cấp là được tính đúng.</div>`,
gen(l){let a,b,rel;if(l===1){a=ri(12,99);b=ri(101,999);rel=.1}else if(l===2){a=ri(101,999);b=ri(101,999);rel=.08}else{a=ri(1001,9999);b=ri(101,999);rel=.05}
const ra=sig2(a),rb=sig2(b);return{q:`≈ ${f(a)} × ${f(b)}`,h:`Sai số trong khoảng ±${rel*100}% được tính đúng`,a:a*b,rel,sol:`Làm tròn: ${f(ra)} × ${f(rb)} = ${f(ra*rb)} (chính xác: ${f(a*b)})`}}},

{id:'q72',g:5,name:'Quy tắc 72 (gấp đôi tiền)',short:'Lãi 8%/năm → khoảng 9 năm thì vốn gấp đôi.',lv:['Số năm gấp đôi','Lãi suất cần thiết','Gấp 4 lần'],
ex:`<p><span class="k">Số năm để gấp đôi ≈ 72 ÷ lãi suất (%/năm)</span> (với lãi kép, tái đầu tư).</p>
<div class="ex">Lãi 8%/năm → 72 ÷ 8 = 9 năm · Tăng trưởng 12%/năm → 6 năm</div>
<ul><li>Ngược lại: muốn gấp đôi sau n năm cần lãi ≈ 72 ÷ n.</li>
<li>Gấp 4 = gấp đôi hai lần → 144 ÷ lãi suất.</li>
<li>Lạm phát 6%/năm → sau 12 năm tiền mất khoảng một nửa sức mua.</li></ul>`,
gen(l){if(l===1){const r=pick([2,3,4,6,8,9,12,18,24]);return{q:`Lãi ${r}%/năm. Sau khoảng bao nhiêu năm vốn gấp đôi?`,u:'năm',a:72/r,tol:.5,sol:`72 ÷ ${r} = ${B(72/r)} năm`}}
if(l===2){const n=pick([3,4,6,8,9,12,18]);return{q:`Muốn vốn gấp đôi sau ${n} năm, cần lãi suất khoảng bao nhiêu %/năm?`,u:'%/năm',a:72/n,tol:.5,sol:`72 ÷ ${n} = ${B(72/n)}%`}}
const r=pick([6,8,9,12,18]);return{q:`Tăng trưởng ${r}%/năm. Sau khoảng bao nhiêu năm doanh thu gấp 4?`,u:'năm',a:144/r,tol:.6,sol:`Gấp 4 = gấp đôi 2 lần → 2 × (72 ÷ ${r}) = 144 ÷ ${r} = ${B(144/r)} năm`}}},

{id:'thu9',g:5,name:'Phép thử số 9 (kiểm tra kết quả)',short:'Phát hiện phép nhân sai trong vài giây.',lv:['2 × 2 chữ số','3 × 2 chữ số','3 × 3 chữ số'],
ex:`<p><b>Số kiểm tra</b> của một số = cộng các chữ số liên tục đến khi còn 1 chữ số (bỏ qua được các số 9 và nhóm có tổng 9). Ví dụ 4.785 → 4+7+8+5 = 24 → 6.</p>
<p>Nếu A × B = C đúng thì: <span class="k">kiểm tra(A) × kiểm tra(B)</span>, rút gọn lại, phải bằng <span class="k">kiểm tra(C)</span>.</p>
<div class="ex">47 × 23 = 1.081? → 47 → 11 → 2; 23 → 5; 2 × 5 = 10 → 1. Vế phải: 1+0+8+1 = 10 → 1. Khớp ✓</div>
<ul><li><b>Không khớp</b> → chắc chắn sai.</li><li><b>Khớp</b> → nhiều khả năng đúng (phép thử không bắt được lỗi đảo chỗ chữ số, ví dụ 1.081 ↔ 1.801).</li></ul>`,
gen(l){const[a,b]=l===1?[ri(12,99),ri(12,99)]:l===2?[ri(101,999),ri(12,99)]:[ri(101,999),ri(101,999)];const c=a*b,ok=Math.random()<.5;let C=c;
if(!ok){let d;do{d=pick([1,2,3,4,5,6,7,8,10,20,30,100,200])*pick([1,-1])}while(d%9===0||c+d<=0);C=c+d}
const ra=dr(a),rb=dr(b),rp=dr(ra*rb),rc=dr(C);
return{q:`${f(a)} × ${f(b)} = ${f(C)}`,h:'Dùng phép thử số 9: kết quả này đúng hay sai?',choices:['Đúng','Sai'],ans:ok?'Đúng':'Sai',
sol:`${drChain(a)}; ${drChain(b)} → ${ra} × ${rb} = ${ra*rb} → ${rp}. Vế phải: ${drChain(C)}. ${rp===rc?'Khớp → nhiều khả năng đúng':'Không khớp → chắc chắn sai'}. (Kết quả đúng: ${f(c)})`}}},

{id:'tancung',g:5,name:'Kiểm tra chữ số tận cùng',short:'…7 × …3 thì kết quả phải tận cùng bằng 1.',lv:['2 × 2 chữ số','3 × 3 chữ số','Ba thừa số'],
ex:`<p>Chữ số tận cùng của tích chỉ phụ thuộc vào chữ số tận cùng của các thừa số. Đây là cách kiểm tra nhanh nhất trong 1 giây.</p>
<div class="ex">847 × 233 → 7 × 3 = 21 → tích phải tận cùng bằng <b>1</b><br>36 × 48 × 17 → 6 × 8 = 48 → 8; 8 × 7 = 56 → tận cùng <b>6</b></div>
<p>Kết hợp với ước lượng độ lớn: đúng cỡ + đúng chữ số cuối + khớp phép thử 9 → gần như chắc chắn đúng.</p>`,
gen(l){if(l<3){const a=l===1?ri(12,99):ri(101,999),b=l===1?ri(12,99):ri(101,999);const u=(a%10)*(b%10);
return{q:`Chữ số tận cùng của ${f(a)} × ${f(b)}`,a:(a*b)%10,sol:`Chỉ cần nhân hai chữ số cuối: ${a%10} × ${b%10} = ${u} → ${B(u%10)}`}}
const a=ri(12,99),b=ri(12,99),c=ri(12,99),u1=(a%10)*(b%10),u2=(u1%10)*(c%10);
return{q:`Chữ số tận cùng của ${a} × ${b} × ${c}`,a:(a*b*c)%10,sol:`${a%10} × ${b%10} = ${u1} → ${u1%10}; ${u1%10} × ${c%10} = ${u2} → ${B(u2%10)}`}}},

// ---------- NHÓM 6 ----------
{id:'margin',g:6,name:'Markup và biên lợi nhuận (margin)',short:'Markup 25% chỉ là margin 20%. Hai khái niệm hay bị nhầm.',lv:['Markup → margin','Margin → markup','Từ giá vốn & giá bán'],
ex:`<ul><li><b>Markup</b> = lãi ÷ <b>giá vốn</b></li><li><b>Margin</b> (biên lợi nhuận) = lãi ÷ <b>giá bán</b></li></ul>
<div class="ex">Giá vốn 100, bán 125: lãi 25 → markup 25%, nhưng margin = 25 ÷ 125 = <b>20%</b></div>
<p>Công thức chuyển đổi (dùng số 100 cho dễ nhẩm):</p>
<ul><li><span class="k">margin = markup ÷ (100 + markup)</span>: markup 50% → 50 ÷ 150 = 33,3%</li>
<li><span class="k">markup = margin ÷ (100 − margin)</span>: margin 40% → 40 ÷ 60 = 66,7%</li></ul>
<div class="tbwrap"><table class="tb"><tr><th>Markup</th><td>10%</td><td>20%</td><td>25%</td><td>33,3%</td><td>50%</td><td>66,7%</td><td>100%</td></tr><tr><th>Margin</th><td>9,1%</td><td>16,7%</td><td>20%</td><td>25%</td><td>33,3%</td><td>40%</td><td>50%</td></tr></table></div>
<div class="warn">Đáp án trong khoảng ±0,5% được tính đúng.</div>`,
gen(l){if(l===1){const mk=pick([10,20,25,50,60,100]);const m=r2(mk/(100+mk)*100);return{q:`Markup ${mk}% (lãi tính trên giá vốn). Biên lợi nhuận (lãi tính trên giá bán) là bao nhiêu?`,u:'%',a:m,tol:.5,sol:`Giá vốn 100 → giá bán ${100+mk}, lãi ${mk} → ${mk} ÷ ${100+mk} ≈ ${B(m)}%`}}
if(l===2){const m=pick([10,20,25,30,40,50,60]);const mk=r2(m/(100-m)*100);return{q:`Muốn biên lợi nhuận ${m}% thì markup trên giá vốn phải là bao nhiêu?`,u:'%',a:mk,tol:.5,sol:`Giá bán 100 → giá vốn ${100-m}, lãi ${m} → ${m} ÷ ${100-m} ≈ ${B(mk)}%`}}
const c=ri(2,20)*10,k=pick([1.2,1.25,1.4,1.5,1.6,2]),p=r2(c*k),m=r2((p-c)/p*100);return{q:`Giá vốn ${f(c)}k, giá bán ${f(p)}k. Biên lợi nhuận là bao nhiêu?`,u:'%',a:m,tol:.5,sol:`Lãi ${f(r2(p-c))}k ÷ giá bán ${f(p)}k ≈ ${B(m)}%`}}},

{id:'giaban',g:6,name:'Định giá bán theo margin mục tiêu',short:'Giá bán = giá vốn ÷ (1 − margin).',lv:['Margin 20–50%','Margin 30–60%','Margin 12–36%'],
ex:`<p>Muốn biên lợi nhuận m% (tính trên giá bán) thì <span class="k">giá bán = giá vốn ÷ (1 − m)</span>.</p>
<div class="ex">Giá vốn 60k, muốn margin 40% → 60 ÷ 0,6 = <b>100k</b> (kiểm tra: lãi 40 ÷ 100 = 40% ✓)</div>
<div class="warn">Sai lầm phổ biến: 60 × 1,4 = 84k → margin thực chỉ 24 ÷ 84 ≈ 28,6%.</div>
<p>Mẹo nhẩm: ÷ 0,5 = × 2; ÷ 0,8 = × 1,25; ÷ 0,75 = × 4/3; ÷ 0,6 = × 5/3.</p>`,
gen(l){const m=pick(l===1?[50,20,25,40]:l===2?[30,35,60,45]:[15,12,28,36]);const P=l===3?ri(1,15)*100:ri(2,30)*20;const cost=r2(P*(100-m)/100);
return{q:`Giá vốn ${f(cost)} nghìn đ. Muốn biên lợi nhuận ${m}% thì giá bán là bao nhiêu?`,u:'nghìn đ',a:P,sol:`Giá bán = ${f(cost)} ÷ (1 − ${m}%) = ${f(cost)} ÷ ${f((100-m)/100)} = ${B(P)} (không phải ${f(cost)} × ${f(1+m/100)} = ${f(r2(cost*(1+m/100)))})`}}},

{id:'hoavon',g:6,name:'Điểm hòa vốn',short:'Chi phí cố định ÷ lãi gộp mỗi sản phẩm.',lv:['Lãi gộp tròn','Lãi gộp 12–45k','Lãi gộp lẻ'],
ex:`<p><span class="k">Số sản phẩm hòa vốn = chi phí cố định ÷ (giá bán − chi phí biến đổi)</span></p>
<div class="ex">Chi phí cố định 30 triệu/tháng; bán 85k, chi phí biến đổi 70k/sp → lãi gộp 15k/sp → 30.000 nghìn ÷ 15 = <b>2.000 sản phẩm</b></div>
<p>Nhớ đổi đơn vị trước: triệu → nghìn (× 1.000) để cùng đơn vị với giá.</p>`,
gen(l){const c=pick(l===1?[10,20,25,50]:l===2?[12,15,30,40,45]:[18,24,35,36,65]);const u=l===3?ri(2,80)*50:ri(2,20)*100;const vc=ri(2,20)*5,price=vc+c,FC=r2(c*u/1000);
return{q:`Chi phí cố định ${f(FC)} triệu/tháng. Giá bán ${price}k, chi phí biến đổi ${vc}k/sản phẩm. Bán bao nhiêu sản phẩm thì hòa vốn?`,u:'sản phẩm',a:u,sol:`Lãi gộp mỗi sp = ${price} − ${vc} = ${c}k. ${f(FC)} triệu = ${f(c*u)} nghìn → ${f(c*u)} ÷ ${c} = ${B(u)} sản phẩm`}}},

{id:'doanhthu',g:6,name:'Quy đổi doanh thu tháng, tuần → năm',short:'× 12 = × 10 + × 2; × 52 = × 50 + × 2.',lv:['Triệu/tháng','Tỷ/tháng (số lẻ)','Triệu/tuần × 52'],
ex:`<ul><li><span class="k">× 12 = × 10 + × 2</span>: 1,25 tỷ/tháng → 12,5 + 2,5 = <b>15 tỷ/năm</b></li>
<li><span class="k">× 52 = × 50 + × 2</span> (× 50 = × 100 ÷ 2): 38 triệu/tuần → 1.900 + 76 = <b>1.976 triệu</b></li>
<li>Ngược lại: năm ÷ 12 ≈ ÷ 10 rồi bớt đi khoảng 1/6.</li></ul>`,
gen(l){if(l===1){const M=ri(11,99);return{q:`Doanh thu ${M} triệu/tháng. Cả năm là bao nhiêu?`,u:'triệu',a:M*12,sol:`× 12 = × 10 + × 2 = ${f(M*10)} + ${M*2} = ${B(M*12)}`}}
if(l===2){const M=ri(5,40)/4;return{q:`Doanh thu ${f(M)} tỷ/tháng. Cả năm là bao nhiêu?`,u:'tỷ',a:r2(M*12),sol:`× 12 = × 10 + × 2 = ${f(M*10)} + ${f(M*2)} = ${B(r2(M*12))}`}}
const W=ri(11,99);return{q:`Doanh thu ${W} triệu/tuần. Cả năm (52 tuần) là bao nhiêu?`,u:'triệu',a:W*52,sol:`× 52 = × 50 + × 2 = ${f(W*50)} + ${W*2} = ${B(W*52)}`}}},

{id:'ngoaite',g:6,name:'Quy đổi ngoại tệ',short:'× 25.000 = × 100.000 ÷ 4.',lv:['USD → VND','VND → USD','Tỷ giá 26.000'],

if(l===2){const Tm=ri(1,40)/2;return{q:`${f(Tm)} triệu đ = ? USD`,h:'Tỷ giá giả định: 1 USD = 25.000 đ',u:'USD',a:Tm*40,sol:`1 triệu ÷ 25.000 = 40 USD → ${f(Tm)} × 40 = ${B(Tm*40)} USD`}}

{id:'laisuat',g:6,name:'Lãi suất: năm, tháng, lãi kép',short:'Lãi tháng = lãi năm ÷ 12; lãi kép 2 năm ≈ 2r + r².',lv:['Lãi 1 năm','Lãi 1 tháng','Lãi kép 2 năm'],

{id:'chialai',g:6,name:'Chia theo tỷ lệ',short:'Chia lãi theo 2 : 3 : 5 → tìm giá trị 1 phần.',lv:['2 người','3 người','4 người'],

// ---------- Practice engine ----------
let P=null;
function stopPractice(){if(P){clearInterval(P.iv);clearTimeout(P.to);P=null}}
function pickTopic(cfg){
  const ids=cfg.topics;if(ids.length===1)return ids[0];
  if(!cfg.weak)return pick(ids);
  const w=ids.map(id=>{const s=stats[id];if(!s||s.n<3)return 3;const acc=s.c/s.n,avg=s.c?s.t/s.c/1000:15;return 1+(1-acc)*6+Math.min(avg/5,3)});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<ids.length;i++){r-=w[i];if(r<=0)return ids[i]}return ids[ids.length-1];
}

  <div class="kpt"><button class="link kptog"></button>${cfg.limit?'':`<label><input type="checkbox" class="auto" ${S.auto?'checked':''}> Tự chuyển câu khi đúng</label>`}</div>`;
  P={wrap,cfg,n:0,c:0,streak:0,best:0,tsum:0,cur:null,last:'',answered:false,over:false,to:null,
     deadline:cfg.limit?Date.now()+cfg.limit*1000:0,
     inp:$('.ans',wrap),q:$('.q',wrap),qh:$('.qh',wrap),tag:$('.qtag',wrap),fb:$('.fb',wrap),ch:$('.choices',wrap),arow:$('.arow',wrap),
     unit:$('.unit',wrap),nxt:$('.nxt',wrap),rev:$('.reveal',wrap),ps:$('.ps',wrap),pt:$('.pt',wrap),kp:$('.kp',wrap)};
  const p=P;
  $('.chk',wrap).onclick=()=>submit();
  p.nxt.onclick=()=>nextQ();
  p.rev.onclick=()=>submit(null);
  if(cfg.onStop)$('.pstop',wrap).onclick=cfg.onStop;

  p.kp.onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;
    if(k==='ok'){p.answered?nextQ():submit();return}
    if(p.answered||(p.cur&&p.cur.choices))return;
    if(k==='⌫')p.inp.value=p.inp.value.slice(0,-1);else if(k==='C')p.inp.value='';else p.inp.value+=k};
  const kptog=$('.kptog',wrap);
  const applyKp=()=>{p.kp.hidden=!S.kp||!!(p.cur&&p.cur.choices);p.inp.readOnly=S.kp;p.inp.inputMode=S.kp?'none':'decimal';
    kptog.textContent=S.kp?'⌨ Dùng bàn phím của máy':'🔢 Dùng bàn phím số trên màn hình'};
  p.applyKp=applyKp;
  kptog.onclick=()=>{S.kp=!S.kp;saveS();applyKp();if(!S.kp)p.inp.focus()};
  p.iv=setInterval(tick,100);
  nextQ();
}
function nextQ(){
  const p=P;if(!p||p.over)return;clearTimeout(p.to);
  const id=pickTopic(p.cfg),t=TT[id],lv=p.cfg.level||ri(1,3);
  let q,tries=0;do{q=t.gen(lv);tries++}while(q.q===p.last&&tries<6);
  p.last=q.q;p.cur=Object.assign(q,{id,lv});p.answered=false;
  p.tag.textContent=p.cfg.tag?`${t.name} · Cấp ${lv}`:'';
  p.q.innerHTML=q.q;p.q.classList.toggle('long',q.q.replace(/<[^>]+>/g,'').length>28);
  p.qh.textContent=q.h||'';p.qh.hidden=!q.h;
  p.fb.innerHTML='';p.nxt.hidden=true;p.rev.hidden=false;
  if(q.choices){p.arow.hidden=true;p.ch.hidden=false;p.ch.innerHTML=q.choices.map((c,i)=>`<button data-c="${c}">${c} <small class="muted">(${i+1})</small></button>`).join('');
    $$('button',p.ch).forEach(b=>b.onclick=()=>submit(b.dataset.c))}
  else{p.arow.hidden=false;p.ch.hidden=true;p.ch.innerHTML='';p.inp.value='';p.unit.textContent=q.u||'';$('.chk',p.wrap).hidden=false}
  p.applyKp();
  if(!S.kp&&!q.choices)p.inp.focus({preventScroll:true});
  p.t0=performance.now();tick();
}
function submit(raw){
  const p=P;if(!p||p.answered||p.over)return;const q=p.cur;let ok=false,shown='';
  if(raw===null){ok=false}
  else if(q.choices){if(raw===undefined)return;ok=raw===q.ans;shown=raw}
  else{const v=raw===undefined?p.inp.value:raw;const x=parseNum(v);
    if(x===null){p.inp.classList.remove('shake');void p.inp.offsetWidth;p.inp.classList.add('shake');return}
    ok=q.rel?Math.abs(x-q.a)<=Math.abs(q.a)*q.rel:Math.abs(x-q.a)<=(q.tol||1e-6)+1e-9*Math.abs(q.a);shown=f(x)}
  const ms=performance.now()-p.t0;
  p.answered=true;p.n++;
  if(ok){p.c++;p.streak++;p.best=Math.max(p.best,p.streak);p.tsum+=ms}else p.streak=0;
  record(q.id,ok,ms);
  $('.chk',p.wrap).hidden=true;p.rev.hidden=true;
  if(q.choices)$$('button',p.ch).forEach(b=>{b.disabled=true;if(b.dataset.c===q.ans)b.style.borderColor='var(--ok)'});
  const back=p.cfg.tag?` <button class="link" onclick="location.hash='#/t/${q.id}'">Ôn lại bài này</button>`:'';
  if(ok){p.fb.innerHTML=`<div class="ok">✓ Chính xác · ${fmtS(ms)}${p.streak>=3?` · chuỗi ${p.streak} 🔥`:''}</div>`+(p.cfg.limit?'':`<details><summary>Cách giải</summary><div class="sol">${q.sol}</div></details>`)}
  else p.fb.innerHTML=`<div class="bad">${raw===null?'Lời giải':'✗ Chưa đúng'}${shown&&raw!==null?` (bạn trả lời ${shown})`:''} — Đáp án: ${ansText(q)}</div><div class="sol">${q.sol}${back}</div>`;
  tick();
  if(p.cfg.limit){p.to=setTimeout(nextQ,ok?350:1800)}
  else if(ok&&S.auto){p.to=setTimeout(nextQ,900)}
  else{p.nxt.hidden=false;if(!S.kp||q.choices)p.nxt.focus({preventScroll:true})}
}
function tick(){
  const p=P;if(!p)return;
  p.ps.textContent=`Đúng ${p.c}/${p.n} · Chuỗi ${p.streak}${p.c?` · TB ${fmtS(p.tsum/p.c)}`:''}`;
  if(p.cfg.limit){const left=Math.max(0,p.deadline-Date.now());p.pt.textContent=`⏱ ${Math.ceil(left/1000)} s`;p.pt.classList.toggle('hot',left<10000);if(left<=0)endSprint()}
  else if(!p.answered)p.pt.textContent=fmtS(performance.now()-p.t0);
}
function endSprint(){
  const p=P;if(!p||p.over)return;p.over=true;clearInterval(p.iv);clearTimeout(p.to);
  const key='mm_best_'+p.cfg.limit,best=LS.get(key,0),nb=p.c>best;if(nb)LS.set(key,p.c);
  const cfg=p.cfg,wrap=p.wrap;
  wrap.innerHTML=`<div class="panel done"><h2>Hết giờ!</h2><div class="bignum">${p.c}</div><p>câu đúng trong ${cfg.limit} giây · độ chính xác ${p.n?Math.round(p.c/p.n*100):0}% · chuỗi dài nhất ${p.best}</p>
  <p><b>${nb?'🏆 Kỷ lục mới!':`Kỷ lục của bạn: ${best} câu`}</b></p><div class="btns"><button class="btn primary again">Chơi lại</button>${cfg.onStop?'<button class="btn back">Đổi thiết lập</button>':''}</div></div>`;
  P=null;
  $('.again',wrap).onclick=()=>startPractice(wrap,cfg);
  if(cfg.onStop)$('.back',wrap).onclick=cfg.onStop;
}
document.addEventListener('keydown',e=>{
  const p=P;if(!p||p.over||!document.body.contains(p.wrap))return;
  if(e.target.matches('select,textarea'))return;
  if(e.target.matches('input[type=checkbox]'))return;
  if(e.key==='Enter'){if(e.target.tagName==='BUTTON'&&!p.wrap.contains(e.target))return;e.preventDefault();p.answered?nextQ():(p.cur.choices?null:submit());return}
  if(p.answered||!p.cur)return;
  if(p.cur.choices){if(/^[1-9]$/.test(e.key)){const c=p.cur.choices[+e.key-1];if(c)submit(c)}return}
  if(S.kp&&!e.ctrlKey&&!e.metaKey){
    if(/^[0-9.,]$/.test(e.key)){p.inp.value+=e.key;e.preventDefault()}
    else if(e.key==='Backspace'){p.inp.value=p.inp.value.slice(0,-1);e.preventDefault()}
  }
});

// ---------- Nút nổi chỉnh cỡ chữ ----------
const fabp=$('.fabp'),fabb=$('.fabb'),fsv=$('.fsv');
function applyFs(){document.documentElement.style.fontSize=(16*S.fs)+'px';fsv.textContent=Math.round(S.fs*100)+'%'}
fabb.onclick=e=>{e.stopPropagation();fabp.hidden=!fabp.hidden;fabb.setAttribute('aria-expanded',String(!fabp.hidden))};
fabp.onclick=e=>{e.stopPropagation();const b=e.target.closest('button');if(!b)return;const d=+b.dataset.d;
  S.fs=d===0?1:Math.min(1.6,Math.max(.8,Math.round((S.fs+d*.1)*10)/10));saveS();applyFs()};
document.addEventListener('click',()=>{if(!fabp.hidden){fabp.hidden=true;fabb.setAttribute('aria-expanded','false')}});

applyFs();
route();
</script>
</body>
